<!DOCTYPE html>
<html>
<head>
<title>Box Model With Border Box</title>
<style>
body {
background-color: #f1f5f9;
padding: 40px;
font-family: Arial, sans-serif;
}
.box {
width: 320px;
margin: 40px;
padding: 20px;
border: 8px solid #1e40af;
background-color: #bfdbfe;
box-sizing: border-box;
}
.content {
background-color: #22c55e;
color: white;
padding: 10px;
text-align: center;
font-weight: bold;
}
.info {
margin-top: 10px;
font-size: 14px;
}
</style>
</head>
<body>
<div class="box">
<div class="content">CONTENT AREA</div>
<div class="info">
Width: 320px<br>
Padding: 20px<br>
Border: 8px<br>
Margin: 40px
</div>
</div>
</body>
</html>
